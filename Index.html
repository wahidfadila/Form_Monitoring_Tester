        settings.appsScriptUrl = DEFAULT_APPS_SCRIPT_URL; // selalu pakai default, field readonly
        const status = document.getElementById('conn-status');
        status.className='connection-status testing';
        status.textContent='⏳ Menguji koneksi...';
        const r = await testSheetsConnection();
        if(r.ok){
          status.className='connection-status ok';
          const connUser = r.data.currentUserEmail || '(tidak terdeteksi)';
          const localUser = currentUser ? `${escapeHtml(currentUser.name)} (@${escapeHtml(currentUser.username || currentUser.email || '')})` : '(belum login)';
          let msg = '✓ Terhubung! Apps Script: '+connUser;
          msg += ' · User lokal: '+localUser;
          status.textContent = msg;
        }else{
          status.className='connection-status fail';
          status.textContent='✗ Gagal: '+r.error;
        }
      }},
      {label:'💾 Simpan',class:'btn-primary',onClick:()=>{
        settings.appsScriptUrl = DEFAULT_APPS_SCRIPT_URL; // selalu pakai default, field readonly
        settings.draftSheet = document.getElementById('set-draft-sheet').value.trim() || 'Draft';
        settings.dataSheet = document.getElementById('set-data-sheet').value.trim() || 'Form_gap';
        settings.useExistingHeaders = document.getElementById('set-existing-headers').checked;
        settings.autoSync = document.getElementById('set-auto').checked;
        saveSettings();
        closeModal();
        showToast('Pengaturan tersimpan · Sheet Draft: "'+settings.draftSheet+'" · Sheet Data: "'+settings.dataSheet+'"'+(settings.useExistingHeaders?' · Pakai header existing':''),'success');
        renderList();
      }}
    ]
  });
}

/* On mark submitted - hook to autoSync (unused, kept for reference) */
async function maybeAutoSync(d){
  if(settings.autoSync && isSheetsConfigured() && d.status==='submitted'){
    showToast('Auto-sync ke Google Sheets...','');
    await syncOne(d);
    showToast('Draft tersinkron ke Google Sheets','success');
  }
}


/* ============================================================
   INIT
   ============================================================ */
function init(){
  loadUsers();
  loadSettings();
  // Cek apakah user sudah login
  const user = getCurrentUser();
  if(!user){
    showLoginScreen();
  }else{
    showMainApp();
  }

  document.getElementById('modal-backdrop').addEventListener('click',e=>{
    if(e.target.id==='modal-backdrop') closeModal();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeModal();
  });
  // warn before leave if dirty
  window.addEventListener('beforeunload',e=>{
    if(isDirty){
      e.preventDefault();
      e.returnValue='';
    }
  });
  // === Mobile sync: trigger saat app balik dari background (visibility change) ===
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState === 'visible'){
      // User balik ke app — sync unsynced drafts
      setTimeout(()=>{ syncUnsyncedDraftsBackground(); }, 500);
    }
  });
  // === Mobile sync: trigger saat HP dapet koneksi internet lagi ===
  window.addEventListener('online',()=>{
    console.log('[autoSync] Network online — sync unsynced drafts');
    showToast('🌐 Koneksi internet tersambung — sync data...', '');
    setTimeout(()=>{ syncUnsyncedDraftsBackground(); }, 800);
  });
  // === Mobile sync: trigger saat app pertama kali dibuka (setelah login) ===
  // (dipanggil di showMainApp)
}

function showMainApp(){
  loadDrafts();
  // Bind header buttons (hanya sekali setelah login)
  const btnNew = document.getElementById('btn-new');
  const btnSync = document.getElementById('btn-sync-all');
  const btnSettings = document.getElementById('btn-settings');
  const btnLogout = document.getElementById('btn-logout');
  if(btnNew && !btnNew.dataset.bound){ btnNew.addEventListener('click',startNewForm); btnNew.dataset.bound='1'; }
  if(btnSync && !btnSync.dataset.bound){ btnSync.addEventListener('click',syncAllDrafts); btnSync.dataset.bound='1'; }
  if(btnSettings && !btnSettings.dataset.bound){ btnSettings.addEventListener('click',()=>openSettingsModal()); btnSettings.dataset.bound='1'; }
  if(btnLogout && !btnLogout.dataset.bound){ btnLogout.addEventListener('click',logout); btnLogout.dataset.bound='1'; }

  // Tampilkan info user di header
  const user = getCurrentUser();
  const headerUser = document.getElementById('header-user');
  const userInfo = document.getElementById('user-info');
  if(user){
    headerUser.style.display = 'flex';
    const roleBadge = user.role === 'admin' ? ' <span style="font-size:9px;background:rgba(255,255,255,.25);padding:1px 6px;border-radius:8px;margin-left:4px">ADMIN</span>' : '';
    userInfo.innerHTML = `<span style="font-size:13px">👤 <b>${escapeHtml(user.name||user.email)}</b>${roleBadge}</span>`;
    // Sembunyikan tombol Settings kalau bukan admin
    if(btnSettings) btnSettings.style.display = (user.role === 'admin') ? '' : 'none';
  }
  renderList();
  // === Trigger background sync untuk draft yang belum synced (catch up) ===
  setTimeout(()=>{
    const unsyncedCount = drafts.filter(d => {
      const s = getSyncStatus(d);
      return s === 'unsynced' || s === 'failed';
    }).length;
    if(unsyncedCount > 0){
      console.log('[autoSync] App opened — '+unsyncedCount+' drafts need sync');
      showToast(`⏳ Sync ${unsyncedCount} draft yang belum tersinkron...`, '');
      syncUnsyncedDraftsBackground();
    }else{
      updateSyncIndicator();
    }
  }, 1500);
}

init();
</script>
